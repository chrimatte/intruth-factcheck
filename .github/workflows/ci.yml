name: Extension CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project metadata
        run: npm ci --ignore-scripts
      - name: Lint, test, validate, and build
        run: npm run ci
      - name: Package extension
        run: cd dist && zip -r intruth-extension.zip intruth
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: intruth-extension
          path: dist/intruth-extension.zip
          if-no-files-found: error
